version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Baseline "industry standard" Go checks.
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - unparam
    - errorlint

  settings:
    misspell:
      # Words used intentionally in CLI context.
      ignore-rules:
        - cancelled
        - cancelling

  exclusions:
    rules:
      # Repo-specific: relax checks in tests.
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        text: "shadow"
        linters:
          - govet

formatters:
  enable:
    - gofmt
    - goimports
