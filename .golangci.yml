version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports

issues:
  exclude-rules:
    - path: _test.go
      linters:
        - errcheck
    - path: _test.go
      text: "shadow"
      linters:
        - govet
  exclude-dirs:
    - vendor
